# =========================================================
# TASKCTL HOSTING DEPLOYMENT CONFIGURATION
# =========================================================
#
# This file is intended for deployment execution directly
# on the hosting server.
#
# Deployment Target:
#   $HOME/public_html/news
#
# Repository Source:
#   $HOME/repositories/yii2-news
#
# Published Directories:
#   - backend/web
#   - frontend/web
#   - storage/web
#
# Symlinked Directories:
#   - storage/cache
#   - storage/web/source
#
# Index Replacement:
#   index-hosting.php -> index.php
#
# Requirements:
#   - taskctl installed
#   - shell access enabled
#
# Example Usage:
#
#   taskctl -c taskctl.hosting.yaml hosting:deploy
#
# =========================================================

pipelines:
  hosting:deploy:
    - task: hosting:prepare

    - task: hosting:cleanup
      depends_on: hosting:prepare

    - task: hosting:deploy:root
      depends_on: hosting:cleanup

    - task: hosting:deploy:backend
      depends_on: hosting:deploy:root

    - task: hosting:deploy:frontend
      depends_on: hosting:deploy:root

    - task: hosting:deploy:storage
      depends_on: hosting:deploy:root

    - task: hosting:index
      depends_on:
        - hosting:deploy:backend
        - hosting:deploy:frontend
        - hosting:deploy:storage

    - task: hosting:symlink
      depends_on: hosting:index

    - task: hosting:permissions
      depends_on: hosting:symlink

    - task: hosting:done
      depends_on: hosting:permissions

tasks:

  hosting:prepare:
    command:
      - '[ -d "$HOME/repositories/yii2-news" ] || { echo "Error: repository not found: $HOME/repositories/yii2-news"; exit 1; }'
      - '[ -f ".htaccess" ] || { echo "Error: .htaccess not found"; exit 1; }'
      - '[ -d "backend/web" ] || { echo "Error: backend/web not found"; exit 1; }'
      - '[ -d "frontend/web" ] || { echo "Error: frontend/web not found"; exit 1; }'
      - '[ -d "storage/web" ] || { echo "Error: storage/web not found"; exit 1; }'

      - chmod 711 $HOME/repositories

      - mkdir -p $HOME/public_html/news
      - mkdir -p $HOME/public_html/news/backend
      - mkdir -p $HOME/public_html/news/frontend
      - mkdir -p $HOME/public_html/news/storage

  hosting:cleanup:
    command:
      - '[ -d "$HOME/public_html/news" ] || { echo "Error: deploy directory not found"; exit 1; }'

      - rm -rf $HOME/public_html/news/backend/web
      - rm -rf $HOME/public_html/news/frontend/web
      - rm -rf $HOME/public_html/news/storage/web

  hosting:deploy:root:
    command:
      - cp .htaccess $HOME/public_html/news/.htaccess

  hosting:deploy:backend:
    command:
      - cp -R backend/web $HOME/public_html/news/backend/

  hosting:deploy:frontend:
    command:
      - cp -R frontend/web $HOME/public_html/news/frontend/

  hosting:deploy:storage:
    command:
      - cp -R storage/web $HOME/public_html/news/storage/

  hosting:index:
    command:
      - '[ -f "$HOME/public_html/news/backend/web/index-hosting.php" ] || { echo "Error: backend index-hosting.php not found"; exit 1; }'
      - rm -f $HOME/public_html/news/backend/web/index.php
      - cp $HOME/public_html/news/backend/web/index-hosting.php $HOME/public_html/news/backend/web/index.php

      - '[ -f "$HOME/public_html/news/frontend/web/index-hosting.php" ] || { echo "Error: frontend index-hosting.php not found"; exit 1; }'
      - rm -f $HOME/public_html/news/frontend/web/index.php
      - cp $HOME/public_html/news/frontend/web/index-hosting.php $HOME/public_html/news/frontend/web/index.php

      - '[ -f "$HOME/public_html/news/storage/web/index-hosting.php" ] || { echo "Error: storage index-hosting.php not found"; exit 1; }'
      - rm -f $HOME/public_html/news/storage/web/index.php
      - cp $HOME/public_html/news/storage/web/index-hosting.php $HOME/public_html/news/storage/web/index.php

  hosting:symlink:
    command:
      - '[ -d "$HOME/repositories/yii2-news/storage/cache" ] || { echo "Error: storage/cache not found"; exit 1; }'
      - '[ -d "$HOME/repositories/yii2-news/storage/web/source" ] || { echo "Error: storage/web/source not found"; exit 1; }'

      - rm -rf $HOME/public_html/news/storage/cache
      - ln -s $HOME/repositories/yii2-news/storage/cache $HOME/public_html/news/storage/cache

      - rm -rf $HOME/public_html/news/storage/web/source
      - ln -s $HOME/repositories/yii2-news/storage/web/source $HOME/public_html/news/storage/web/source

  hosting:permissions:
    command:
      - '[ -d "$HOME/repositories/yii2-news/backend/runtime" ] || { echo "Error: backend/runtime not found"; exit 1; }'
      - '[ -d "$HOME/repositories/yii2-news/frontend/runtime" ] || { echo "Error: frontend/runtime not found"; exit 1; }'
      - '[ -d "$HOME/repositories/yii2-news/storage/cache" ] || { echo "Error: storage/cache not found"; exit 1; }'
      - '[ -d "$HOME/repositories/yii2-news/storage/web/source" ] || { echo "Error: storage/web/source not found"; exit 1; }'

      - chmod -R 775 $HOME/repositories/yii2-news/backend/runtime
      - chmod -R 775 $HOME/repositories/yii2-news/frontend/runtime
      - chmod -R 775 $HOME/repositories/yii2-news/storage/cache

      - find "$HOME/repositories/yii2-news/storage/web/source" -type d -exec chmod 775 {} \;
      - find "$HOME/repositories/yii2-news/storage/web/source" -type f -exec chmod 664 {} \;

  hosting:done:
    command:
      - echo "Hosting deployment completed successfully!"