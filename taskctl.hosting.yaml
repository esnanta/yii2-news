# taskctl config for deploying Yii2 web assets directly on hosting server.
#
# What:
# - Publishes `backend/web`, `frontend/web`, and `storage/web` to `$HOME/public_html/news`.
# - Switches `index-hosting.php` to `index.php` for each published app.
# - Recreates symlinks for `storage/cache` and `storage/web/source`.
#
# Why:
# - Provides a repeatable deployment flow with validation and fail-fast checks.
#
# How:
# - Full pipeline: `taskctl -c taskctl.hosting.yaml hosting:deploy`
# - Single step: `taskctl -c taskctl.hosting.yaml hosting:deploy:backend`

pipelines:
  hosting:deploy:
    - task: hosting:prepare
    - task: hosting:cleanup
      depends_on: hosting:prepare
    - task: hosting:deploy:root
      depends_on: hosting:cleanup
    - task: hosting:deploy:backend
      depends_on: hosting:deploy:root
    - task: hosting:deploy:frontend
      depends_on: hosting:deploy:root
    - task: hosting:deploy:storage
      depends_on: hosting:deploy:root
    - task: hosting:index
      depends_on:
        - hosting:deploy:backend
        - hosting:deploy:frontend
        - hosting:deploy:storage
    - task: hosting:symlink
      depends_on: hosting:index
    - task: hosting:permissions
      depends_on: hosting:symlink
    - task: hosting:done
      depends_on: hosting:permissions

tasks:
  hosting:prepare:
    command:
      - 'if command -v rsync >/dev/null 2>&1; then echo "Info: rsync found, incremental deploy enabled"; else echo "Info: rsync not found, fallback to cp"; fi'
      - '[ -f ".env.dist" ] || { echo "Error: source file not found: .env.dist"; exit 1; }'
      - 'if [ -f ".env" ]; then echo "Info: .env already exists, skipping copy"; else cp ".env.dist" ".env"; echo "Info: .env created from .env.dist"; fi'
      - '[ -d "$HOME/repositories/yii2-news" ] || { echo "Error: source repository not found: $HOME/repositories/yii2-news"; exit 1; }'
      - chmod 711 $HOME/repositories
      - mkdir -p $HOME/public_html/news
      - mkdir -p $HOME/public_html/news/backend
      - mkdir -p $HOME/public_html/news/frontend
      - mkdir -p $HOME/public_html/news/storage
      - mkdir -p $HOME/public_html/news/backend/runtime
      - mkdir -p $HOME/public_html/news/frontend/runtime

  hosting:cleanup:
    command:
      - '[ -d "$HOME/public_html/news" ] || { echo "Error: deploy base directory not found: $HOME/public_html/news"; exit 1; }'
      - rm -rf $HOME/public_html/news/backend/web
      - rm -rf $HOME/public_html/news/frontend/web
      - rm -rf $HOME/public_html/news/storage/web

  hosting:deploy:root:
    command:
      - '[ -f .htaccess ] || { echo "Error: source file not found: .htaccess"; exit 1; }'
      - cp .htaccess $HOME/public_html/news/.htaccess

  hosting:deploy:backend:
    command:
      - '[ -d backend/web ] || { echo "Error: source directory not found: backend/web"; exit 1; }'
      - '[ -d "$HOME/public_html/news/backend" ] || { echo "Error: target directory not found: $HOME/public_html/news/backend"; exit 1; }'
      - 'if command -v rsync >/dev/null 2>&1; then rsync -a --delete "backend/web/" "$HOME/public_html/news/backend/web/"; else rm -rf "$HOME/public_html/news/backend/web" && cp -R "backend/web" "$HOME/public_html/news/backend/"; fi'

  hosting:deploy:frontend:
    command:
      - '[ -d frontend/web ] || { echo "Error: source directory not found: frontend/web"; exit 1; }'
      - '[ -d "$HOME/public_html/news/frontend" ] || { echo "Error: target directory not found: $HOME/public_html/news/frontend"; exit 1; }'
      - 'if command -v rsync >/dev/null 2>&1; then rsync -a --delete "frontend/web/" "$HOME/public_html/news/frontend/web/"; else rm -rf "$HOME/public_html/news/frontend/web" && cp -R "frontend/web" "$HOME/public_html/news/frontend/"; fi'

  hosting:deploy:storage:
    command:
      - '[ -d storage/web ] || { echo "Error: source directory not found: storage/web"; exit 1; }'
      - '[ -d "$HOME/public_html/news/storage" ] || { echo "Error: target directory not found: $HOME/public_html/news/storage"; exit 1; }'
      - 'if command -v rsync >/dev/null 2>&1; then rsync -a --delete "storage/web/" "$HOME/public_html/news/storage/web/"; else rm -rf "$HOME/public_html/news/storage/web" && cp -R "storage/web" "$HOME/public_html/news/storage/"; fi'

  hosting:index:
    command:
      - '[ -f "$HOME/public_html/news/backend/web/index-hosting.php" ] || { echo "Error: missing backend hosting index file"; exit 1; }'
      - rm -f $HOME/public_html/news/backend/web/index.php
      - cp $HOME/public_html/news/backend/web/index-hosting.php $HOME/public_html/news/backend/web/index.php

      - '[ -f "$HOME/public_html/news/frontend/web/index-hosting.php" ] || { echo "Error: missing frontend hosting index file"; exit 1; }'
      - rm -f $HOME/public_html/news/frontend/web/index.php
      - cp $HOME/public_html/news/frontend/web/index-hosting.php $HOME/public_html/news/frontend/web/index.php

      - '[ -f "$HOME/public_html/news/storage/web/index-hosting.php" ] || { echo "Error: missing storage hosting index file"; exit 1; }'
      - rm -f $HOME/public_html/news/storage/web/index.php
      - cp $HOME/public_html/news/storage/web/index-hosting.php $HOME/public_html/news/storage/web/index.php

  hosting:symlink:
    command:
      - '[ -d "$HOME/repositories/yii2-news/storage/cache" ] || { echo "Error: source path not found: $HOME/repositories/yii2-news/storage/cache"; exit 1; }'
      - rm -rf $HOME/public_html/news/storage/cache
      - ln -s $HOME/repositories/yii2-news/storage/cache $HOME/public_html/news/storage/cache

      - '[ -d "$HOME/repositories/yii2-news/storage/web/source" ] || { echo "Error: source path not found: $HOME/repositories/yii2-news/storage/web/source"; exit 1; }'
      - rm -rf $HOME/public_html/news/storage/web/source
      - ln -s $HOME/repositories/yii2-news/storage/web/source $HOME/public_html/news/storage/web/source

  hosting:permissions:
    command:
      - '[ -d "$HOME/public_html/news/storage/cache" ] || { echo "Error: path not found: $HOME/public_html/news/storage/cache"; exit 1; }'
      - '[ -d "$HOME/public_html/news/backend/runtime" ] || { echo "Error: path not found: $HOME/public_html/news/backend/runtime"; exit 1; }'
      - '[ -d "$HOME/public_html/news/frontend/runtime" ] || { echo "Error: path not found: $HOME/public_html/news/frontend/runtime"; exit 1; }'
      - chmod -R 775 $HOME/public_html/news/storage/cache
      - chmod -R 775 $HOME/repositories/yii2-news/backend/runtime
      - chmod -R 775 $HOME/repositories/yii2-news/frontend/runtime

  hosting:done:
    command:
      - echo "Hosting deployment completed!"
